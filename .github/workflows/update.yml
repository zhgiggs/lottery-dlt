# ============================================================
# 大乐透数据自动更新（纯 17500.cn 版）
# 每天自动去 17500.cn 抓大乐透开奖数据 → 转成 dlt.csv → 提交回仓库
# 并可选同步到 Gitee 做双备份（国内访问更快）。
# 把本文件内容放进仓库的 .github/workflows/update.yml 即可。
# ============================================================
name: 每日更新大乐透数据(17500版)

on:
  schedule:
    - cron: "30 22 * * *"   # 每天 UTC 22:30 ≈ 北京时间 06:30（开奖后）
  workflow_dispatch:         # 允许在 Actions 页面手动点 Run workflow 立即跑

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 允许把抓到的数据 push 回仓库（关键，否则提交会被拒）

    steps:
      - name: 下载仓库代码
        uses: actions/checkout@v4

      - name: 抓取 17500.cn 并转为 CSV
        run: |
          python3 - <<'PY'
          import urllib.request, csv, time, sys, os

          HDR = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'text/plain, */*',
          }

          # 17500 同时试 http 和 https，各重试 3 次
          SOURCES = [
              "https://data.17500.cn/dlt_desc.txt",
              "http://data.17500.cn/dlt_desc.txt",
          ]

          text = None
          errors = []
          for url in SOURCES:
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request(url, headers=HDR)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          text = r.read().decode('utf-8', errors='ignore')
                      print(f"✅ 成功抓取 {url}（第{attempt}次尝试）")
                      break
                  except Exception as e:
                      msg = f"{url} 第{attempt}次失败：{e}"
                      print(msg)
                      errors.append(msg)
                      time.sleep(1.5)
              if text:
                  break

          if not text:
              print("❌ 所有源均失败，本次不更新。错误汇总：")
              for e in errors:
                  print("  -", e)
              with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as sf:
                  sf.write("## ❌ 更新失败\n\n所有数据源均无法访问：\n\n")
                  for e in errors:
                      sf.write(f"- {e}\n")
              sys.exit(1)

          # ---- 17500 是 45 列、空格分隔，完整保留（A列→AS列，不丢任何列） ----
          HDR_CSV = ['开奖期号','开奖日期','前区1','前区2','前区3','前区4','前区5','后区1','后区2',
                     '后区出球顺序1','后区出球顺序2','前区出球顺序1','前区出球顺序2','前区出球顺序3','前区出球顺序4','前区出球顺序5',
                     '投注总额','滚入下期一等奖池','一等注数','一等奖单注奖金','二等注数','二等奖单注奖金',
                     '三等注数','三等奖单注奖金','四等注数','四等奖单注奖金','五等注数','五等奖单注奖金',
                     '六等注数','六等奖单注奖金','七等注数','七等奖单注奖金','八等注数','八等奖单注奖金',
                     '九等注数','九等奖单注奖金','追加一等注数','追加一等奖单注奖金','追加二等注数','追加二等奖单注奖金',
                     '追加三等注数','追加三等奖单注奖金','附加玩法投注总额','一等奖注数','一等奖单注奖金']

          rows = []
          skipped = 0
          for line in text.strip().splitlines():
              t = line.split()          # 按空白（含连续空格）拆分
              if len(t) < 45:
                  skipped += 1
                  continue
              rec = [x if x != '-' else '' for x in t[:45]]   # 完整 45 列，与 17500 源一一对应
              rows.append(rec)

          # 用 utf-8-sig（带 BOM）写入，Excel 直接打开中文不会乱码
          with open('dlt.csv', 'w', newline='', encoding='utf-8-sig') as f:
              w = csv.writer(f)
              w.writerow(HDR_CSV)
              w.writerows(rows)

          print(f"✅ 已写出 dlt.csv：{len(rows)} 期（跳过字段不足行 {skipped}）")
          print(f"   最新一期：{rows[0][0]}（{rows[0][1]}）")
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as sf:
              sf.write(f"## ✅ 更新成功\n\n- 数据来源：17500.cn\n- 共 {len(rows)} 期\n- 最新一期：**{rows[0][0]}（{rows[0][1]}）**\n")
          PY

      - name: 提交回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dlt.csv
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新大乐透开奖数据 $(date +%F)"
            git push
          fi

      - name: 跨推到 Gitee（可选，未配置 Secrets 则自动跳过）
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          if [ -z "$GITEE_USER" ] || [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "未配置 Gitee Secrets，跳过双备份（不影响主流程）"
            exit 0
          fi
          git remote add gitee https://"$GITEE_TOKEN"@gitee.com/"$GITEE_USER"/"$GITEE_REPO".git
          git push gitee HEAD:master --force || echo "Gitee 推送失败（不影响 GitHub 主仓库）"
